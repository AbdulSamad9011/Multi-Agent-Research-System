[project]
name = "research-agent"
version = "0.1.0"
description = "A stateful multi-agent research system built with LangGraph: planner -> parallel sub-agents -> summarizer."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abdul Samad", email = "samadfaridi812@gmail.com" }
]
dependencies = [
    "langchain>=1.1",
    "langgraph>=1.1",
    "langchain-tavily>=0.2",
    "langchain-text-splitters>=0.3",
    "langchain-groq>=1.0",
    "langchain-google-genai>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
